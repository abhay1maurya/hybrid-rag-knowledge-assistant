<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocuMindAI | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/loginpage.css" />
  <script src="js/loginpage.js" defer></script>
</head>
<body>
  <main class="main-container">
    <section class="login-card">
      <div class="login-info">
        <a href="/" class="link-back">← Back to Home</a>
        <h1 class="gradient-heading">Welcome back</h1>
        <p class="description">Access your assistant workspace, document insights, and team knowledge channels.</p>
        <div class="links-group">
          <p><a href="/pricinglagacy" class="link-hover">View plans →</a></p>
          <p><a href="/support" class="link-hover">Contact support →</a></p>
        </div>
      </div>
      <!-- onsubmit="loginDemo(event)" class="login-form" -->
      <form action="/login" method="post">
        <label for="email" class="form-label">Email</label>
        <input id="email" name="email" type="email" class="form-input" placeholder="name@company.com" />
        
        <label for="password" class="form-label">Password</label>
        <input id="password" name="password"  type="password" class="form-input" placeholder="••••••••" />
        
        <button type="submit" class="btn-primary">Sign In</button>
        
        
        <p class="signup-text">
          Don't have an account? <a href="/signup" class="link-brand">Sign up</a>
        
        <p id="note" class="note-text">✓ Use any credentials to continue in demo mode.</p>
        
          <div class="sso-buttons">
            <a href="/oauth2/authorization/google" class="btn-sso"> Continue with Google</a>
     
        </div>
       
      </form>
    </section>
  </main>
</body>
</html>
